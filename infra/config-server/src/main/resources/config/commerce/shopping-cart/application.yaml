spring:
  application:
    name: shopping-cart

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:cartDB}
    username: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: ${CART_PORT:0}

resilience4j:
  circuitbreaker:
    instances:
      warehouse:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s

  retry:
    instances:
      warehouse:
        maxAttempts: 3
        waitDuration: 500ms
        exponentialBackoffMultiplier: 2
        enableRandomizedWait: true
        randomizedWaitFactor: 0.5
        ignoreExceptions:
          - ru.yandex.practicum.exception.BadRequestException
          - ru.yandex.practicum.exception.NotFoundException
          - ru.yandex.practicum.exception.WarehouseUnavailableException

logging:
  level:
    io.github.resilience4j: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
